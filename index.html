<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remont boshqaruv paneli</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SABB">
<style>html,body{margin:0;height:100%;background:#F4F5F7;color:#6B7280;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}#ld{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}</style>
</head>
<body>
<div id="ld">⏳ SABB yuklanmoqda…</div>
<script>
// Ulagich: panelning eng yangi versiyasini serverdan oladi va telefonda saqlab qo'yadi.
(function () {
  var SRC = "https://script.google.com/macros/s/AKfycbzvfAfgmXnrHedBFHMMQ6xttmmdhAgkJYuBNtnyCdIk_XSJIcofJrc9t-6aqnh11mvDDA/exec?raw=1";
  var K = "sabb_app_html_v1", cached = null;
  try { if (localStorage.getItem("theme") === "night") document.body.style.background = "#111214"; cached = localStorage.getItem(K); } catch (e) {}
  function run(h) { document.open(); document.write(h); document.close(); }
  function get() {
    return fetch(SRC, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (t) { if (t.length < 20000 || t.indexOf("<html") < 0) throw new Error("bad"); return t; });
  }
  function save(t) { try { localStorage.setItem(K, t); } catch (e) {} }
  if (cached) {
    get().then(function (t) { if (t !== cached) save(t); }).catch(function () {});
    var go = function () { run(cached); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(go, 0); }); else setTimeout(go, 0);
  } else {
    (function retry(n) {
      get().then(function (t) { save(t); run(t); }).catch(function () {
        if (n < 4) setTimeout(function () { retry(n + 1); }, 1500);
        else document.getElementById("ld").innerHTML = "Internet bilan aloqa yo'q.<br><br><button onclick=\"location.reload()\" style=\"padding:12px 20px;border-radius:12px;border:0;background:#C9962A;color:#1A1206;font-weight:600\">Qayta urinish</button>";
      });
    })(0);
  }
})();
</script>
</body>
</html>
